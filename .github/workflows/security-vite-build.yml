name: Vite security patch validation

on:
  push:
    branches:
      - agent/security-vite-6-4-1
    paths:
      - package.json

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-vite-6-4-1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install without creating a lockfile
        id: install
        continue-on-error: true
        run: npm install --no-package-lock

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Record validation status
        if: always()
        run: |
          printf 'install=%s\nbuild=%s\n' "${{ steps.install.outcome }}" "${{ steps.build.outcome }}" > .security-vite-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .security-vite-status.txt
          git commit -m "Record Vite security validation status"
          git push origin HEAD:agent/security-vite-6-4-1

      - name: Fail when validation did not pass
        if: always() && (steps.install.outcome != 'success' || steps.build.outcome != 'success')
        run: exit 1
