<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">SettleKit US Healthcare Gap Planner</title><desc id="desc">A healthcare coverage gap planning dashboard concept for immigrants, international students, and workers moving to the United States.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf5"/><stop offset="1" stop-color="#f8eee4"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#fbf8f4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#13273a" flood-opacity=".16"/></filter></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><circle cx="1110" cy="72" r="145" fill="#cdb9ef" opacity=".42"/><circle cx="86" cy="552" r="108" fill="#aee6d6" opacity=".42"/><g font-family="Arial, sans-serif"><g transform="translate(62 58)"><circle cx="34" cy="34" r="34" fill="#ff8f77"/><path d="M20 37c8-19 23-19 28 0-4 12-10 18-14 21-6-4-12-10-14-21z" fill="#fff"/><text x="84" y="31" font-size="34" font-weight="800" fill="#13273a">SettleKit</text><text x="84" y="55" font-size="15" fill="#526273">US healthcare gap planner for newcomers</text></g><g transform="translate(62 164)"><text font-size="53" font-weight="800" fill="#13273a">Move to the US with a clearer</text><text y="59" font-size="53" font-weight="800" fill="#ff8f77">healthcare coverage plan.</text><text y="112" font-size="21" fill="#526273">A product prototype for immigrants, international students, and workers</text><text y="144" font-size="21" fill="#526273">exploring possible coverage gaps before arrival.</text><g transform="translate(0 184)"><rect width="184" height="50" rx="25" fill="#ff8f77"/><text x="92" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Coverage timeline</text><rect x="198" width="170" height="50" rx="25" fill="#13273a"/><text x="283" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Risk dashboard</text><rect x="382" width="186" height="50" rx="25" fill="#aee6d6"/><text x="475" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#225744">Arrival checklist</text></g><g transform="translate(0 276)"><text font-size="15" font-weight="700" fill="#13273a">Prototype disclaimer</text><text y="28" font-size="15" fill="#647383">Not medical, legal, financial, or insurance advice.</text></g></g><g transform="translate(720 65)" filter="url(#s)"><rect width="420" height="500" rx="28" fill="url(#card)" stroke="#e7ddd4"/><rect x="20" y="20" width="380" height="72" rx="18" fill="#13273a"/><text x="40" y="47" font-size="12" font-weight="700" fill="#aee6d6">YOUR FIRST 90 DAYS</text><text x="40" y="72" font-size="23" font-weight="800" fill="#fff">Coverage gap overview</text><g transform="translate(22 114)"><rect width="376" height="84" rx="16" fill="#fff1ef"/><circle cx="34" cy="42" r="17" fill="#ff8f77"/><text x="66" y="34" font-size="13" font-weight="700" fill="#a63e2c">DAY 0</text><text x="66" y="57" font-size="17" font-weight="700" fill="#13273a">Arrive in the United States</text><rect y="98" width="376" height="112" rx="16" fill="#fff8e8"/><circle cx="34" cy="142" r="17" fill="#f7c66b"/><text x="66" y="128" font-size="13" font-weight="700" fill="#8f5e10">DAY 1–90</text><text x="66" y="151" font-size="17" font-weight="700" fill="#13273a">Possible coverage gap window</text><text x="66" y="176" font-size="13" fill="#647383">Confirm employer, university, or private coverage dates.</text><rect y="224" width="376" height="84" rx="16" fill="#f0fdf9"/><circle cx="34" cy="266" r="17" fill="#aee6d6"/><path d="M26 266l6 6 11-13" fill="none" stroke="#2d7a62" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="258" font-size="13" font-weight="700" fill="#2d7a62">PLAN READY</text><text x="66" y="282" font-size="17" font-weight="700" fill="#13273a">Questions and next steps organized</text></g><g transform="translate(22 440)"><rect width="376" height="42" rx="21" fill="#ff8f77"/><text x="188" y="27" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Explore the planning dashboard</text></g></g></g></svg>